[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sop-test"
version = "0.1.0"
description = "A starter Python project"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
sop-test = "sop_test:main"

[tool.setuptools.packages.find]
where = ["src"]
